<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 40" width="145" height="40">
  <defs>
    <!-- Gradient Blue -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Gradient Orange -->
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <style>
    /* Animações CSS 100% compatíveis com a especificação SVG 1.1 */
    .animated-abc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: 1.5px;
      fill: #ffffff;
      animation: abcPulse 4s infinite ease-in-out;
    }

    @keyframes abcPulse {
      0%, 100% { fill: #ffffff; }
      50% { fill: #38bdf8; }
    }

    .animated-dot {
      fill: #fb923c;
      animation: dotPulse 2s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { fill: #fb923c; opacity: 1; }
      50% { fill: #00ffb2; opacity: 0.7; }
    }

    .bracket-left {
      animation: shiftLeft 3s infinite ease-in-out;
    }
    .bracket-right {
      animation: shiftRight 3s infinite ease-in-out;
    }

    @keyframes shiftLeft {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-1.5px); }
    }
    @keyframes shiftRight {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(1.5px); }
    }
  </style>

  <!-- Brackets Código </> -->
  <g transform="translate(2, 0)">
    <!-- Opening < -->
    <path class="bracket-left" d="M 12 10 L 4 20 L 12 30" stroke="url(#grad-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Slash / -->
    <path class="bracket-slash" d="M 22 8 L 16 32" stroke="url(#grad-orange)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Closing > -->
    <path class="bracket-right" d="M 26 10 L 34 20 L 26 30" stroke="url(#grad-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Texto "ABC" -->
  <text x="48" y="29" class="animated-abc">ABC</text>
  
  <!-- Ponto Terminal "." renderizado como círculo limpo para evitar erros em <tspan> -->
  <circle cx="127" cy="26" r="3.5" class="animated-dot" />
</svg>
